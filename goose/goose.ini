# =============================================================================
# supervisord program for the bundled goose sibling container
# goose serve exposes ACP over HTTP + WebSocket on 0.0.0.0:3284.
# The server secret (GOOSE_SERVER__SECRET_KEY) and provider credentials are
# injected as environment variables by docker-compose.yml / .env.
# =============================================================================
[program:goose]
process_name=%(program_name)s
command=/usr/local/bin/goose-serve.sh
autostart=true
autorestart=true
priority=1
pidfile=/tmp/goose.pid
redirect_stderr=true
stdout_logfile=/var/www/logs/process-goose.log
environment=HOME="/root",GOOSE_DISABLE_KEYRING="1",NO_COLOR="1"
# =============================================================================
# docker-a2a-gateway
# =============================================================================
# A SilvaEngine Gateway image exposing ONLY the native A2A protocol surface
# (a2a_protocol_plugin), bridging A2A tasks to a Hermes Agent API Server and/or
# an OpenClaw Gateway. Consolidates what were previously two separate images
# (docker-a2a-hermes-agent-gateway, docker-a2a-openclaw-gateway) — the A2A
# gateway image is identical either way; only which sibling agent(s) you
# bundle changes.
#
# Four services:
#   - a2a-gateway (always on)  — the SilvaEngine Gateway, A2A-only routes.
#   - postgres    (optional)   — PostgreSQL persistence backend. Enabled via
#                                the `postgres` compose profile.
#   - hermes      (optional)   — Nous Research Hermes Agent, sibling API
#                                server the gateway can bridge to. Enabled via
#                                the `hermes` compose profile.
#   - openclaw    (optional)   — OpenClaw Gateway (Node.js + Python), sibling
#                                OpenAI-compatible API the gateway can bridge
#                                to. Enabled via the `openclaw` compose
#                                profile.
#   - pi          (optional)   — pi (pi.dev, coding agent) via a Node sidecar
#                                driving `pi --mode rpc` child processes over
#                                stdin/stdout JSONL (pi has no network server;
#                                see ./pi/README.md). Enabled via the `pi`
#                                compose profile.
#
# `hermes` and `openclaw` are independent options: enable one, the other,
# both, or neither (and point *_API_URL at an external instance instead).
# Per-agent routing uses agent metadata in PostgreSQL: each bridge is reached
# by its own agent_uuid (seeded by scripts/seed_agents.py). See .env.example.
# =============================================================================

services:
  # ── A2A Gateway (always on) ───────────────────────────────────────────────
  a2a-gateway:
    build:
      context: .
      args:
        # Cache-buster for the git-installed module layer (see Dockerfile):
        # set MODULE_STAMP in the environment to the a2a_protocol_plugin
        # commit sha whenever that repo changes, then `docker compose build`.
        MODULE_STAMP: ${MODULE_STAMP:-none}
    container_name: ${A2A_GATEWAY_CONTAINER_NAME:-a2a-gateway}
    env_file:
      - .env
    ports:
      # host:container — container bind port is GATEWAY_PORT
      - "${CONTAINER_PORT:-8765}:${GATEWAY_PORT:-8765}"
    volumes:
      - ./logs:/var/log/supervisor
      - ./data:/app/data
      # Mount the routes.yaml loader over the one baked into the image. The
      # gateway finds it via GATEWAY_ROUTES_CONFIG_PATH=/app/routes.yaml (set in
      # the Dockerfile). Edit ./routes.yaml on the host + restart — no rebuild.
      # To use a different manifest, change GATEWAY_ROUTES_HOST_FILE below.
      - ${GATEWAY_ROUTES_HOST_FILE:-./routes.yaml}:/app/routes.yaml:ro
      # Drop-in addon modules (see ./addons/README.md). routes.yaml's single
      # `!include data/_addons_generated.yaml` line pulls in whatever the
      # entrypoint merges from here at container start — add/edit/remove
      # files under ./addons/ + restart, routes.yaml never needs to change.
      - ${ADDONS_HOST_DIR:-./addons}:/app/addons:ro
      # Read-only framework and addon source roots. PYTHONPATH selects the
      # repositories to import instead of the image's installed packages.
      - ${SILVAENGINE_SRC:-../silvaengine}:/app/src:ro
      - ${EXTRA_MODULES_DIR:-./www/projects}:/app/extra_modules:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=${PYTHONPATH:-}
      # PostgreSQL connection defaults for a2a_protocol_plugin. db_backend is
      # forced to "postgresql" in the Dockerfile (no DynamoDB option). These
      # default to the bundled 'postgres' service; .env overrides any of them
      # (e.g. PG_HOST=host.docker.internal for an external Postgres).
      - PG_HOST=${PG_HOST:-postgres}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER:-silvaengine}
      - PG_PASSWORD=${PG_PASSWORD:-silvaengine}
      - PG_DB=${PG_DB:-silvaengine}
      - initialize_tables=${initialize_tables:-1}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      hermes:
        condition: service_healthy
        required: false
      openclaw:
        condition: service_started
        required: false
      goose:
        condition: service_started
        required: false
      pi:
        condition: service_started
        required: false
    restart: unless-stopped
    healthcheck:
      # /health is public (no auth) — see silvaengine_gateway routes.
      test: ["CMD", "curl", "-f", "http://localhost:${GATEWAY_PORT:-8765}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # No `command:` here — the image CMD (docker-entrypoint.sh) must run so
    # the addon merge writes data/_addons_generated.yaml before supervisord.

  # ── Optional bundled PostgreSQL (enable with the `postgres` profile) ──────
  # PostgreSQL is the sole persistence backend for a2a_protocol_plugin
  # (db_backend=postgresql is forced in the image — no DynamoDB option).
  # This service is OPTIONAL: enable its profile and keep PG_HOST=postgres;
  # or leave the profile off and point PG_* at an external PostgreSQL in
  # .env. Tables + RLS tenant-isolation policies are auto-created on gateway
  # startup when initialize_tables=1.
  #
  # Bootstrap credentials come straight from PG_USER/PG_PASSWORD/PG_DB (the
  # same vars the gateway uses to connect) — the postgres image itself still
  # needs env vars literally named POSTGRES_USER/PASSWORD/DB, but there is no
  # separate POSTGRES_* value to keep in sync in .env; one set of credentials
  # drives both sides.
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-a2a-postgres}
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${PG_USER:-silvaengine}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-silvaengine}
      POSTGRES_DB: ${PG_DB:-silvaengine}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-./postgres_data}:/var/lib/postgresql/data
      - ${POSTGRES_LOG_PATH:-./postgres_logs}:/var/log/postgresql
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
      - "-c"
      - "log_statement=${LOG_STATEMENT:-none}"
      - "-c"
      - "log_min_duration_statement=${LOG_MIN_DURATION:-1000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-silvaengine} -d ${PG_DB:-silvaengine}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First start runs initdb into an empty bind mount (~40s observed on a
      # Windows host) and bounces the server once; without a grace period the
      # check exhausts its retries mid-init, and the gateway (optional
      # dependency) starts without waiting for the database.
      start_period: 120s

  # ── Option A: Hermes Agent (optional sibling — enable with the `hermes` profile)
  # Nous Research Hermes Agent running its OpenAI-compatible API server, which
  # the A2A gateway bridges to over HTTP + SSE. Configuration mirrors
  # ../docker-hermes-agent/. The gateway reaches it at http://hermes:8642 when
  # this profile is active (set HERMES_API_URL=http://hermes:8642 in .env).
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent}:${HERMES_TAG:-latest}
    container_name: ${HERMES_CONTAINER_NAME:-container-hermes}
    profiles: ["hermes"]
    restart: unless-stopped
    # Wrap the Hermes entrypoint: apply .env model/provider settings to
    # config.yaml (idempotent — safe on every start), then run the gateway.
    # This makes Hermes fully .env-driven on first start, like OpenClaw.
    # HERMES_MODEL_PROVIDER maps to Hermes's own provider names:
    #   openai_compat / openai / ollama / custom → "custom" (OpenAI-compatible endpoint)
    #   anthropic                               → "anthropic"
    #   openrouter                              → "openrouter"
    #   nous                                     → "nous"
    # $$ escapes $$ for compose, so $PROVIDER etc. are resolved by the
    # container's shell, not by docker-compose interpolation.
    command: >
      sh -c '
        PROVIDER="$${HERMES_MODEL_PROVIDER:-anthropic}";
        case "$$PROVIDER" in
          openai|openai_compat|ollama|custom)
            hermes config set model.provider custom 2>/dev/null;
            hermes config set model.base_url "$${OPENAI_BASE_URL}" 2>/dev/null;
            hermes config set model.api_key "$${OPENAI_API_KEY}" 2>/dev/null
            ;;
          anthropic)
            hermes config set model.provider anthropic 2>/dev/null;
            hermes config set model.api_key "$${ANTHROPIC_API_KEY}" 2>/dev/null
            ;;
          openrouter)
            hermes config set model.provider openrouter 2>/dev/null;
            hermes config set model.api_key "$${OPENROUTER_API_KEY}" 2>/dev/null
            ;;
          nous)
            hermes config set model.provider nous 2>/dev/null;
            hermes config set model.api_key "$${NOUS_API_KEY}" 2>/dev/null
            ;;
        esac;
        hermes config set model.default "$${HERMES_MODEL:-hermes-agent}" 2>/dev/null;
        exec /opt/hermes/docker/entrypoint-dispatch.sh gateway run
      '
    env_file:
      - .env
    ports:
      # Gateway OpenAI-compatible API server + health endpoint.
      # HERMES_GATEWAY_PORT = host port; API_SERVER_PORT = in-container port.
      - "${HERMES_GATEWAY_PORT:-8642}:${API_SERVER_PORT:-8642}"
      # Web dashboard (only reachable when HERMES_DASHBOARD=1).
      # HERMES_DASHBOARD_HOST_PORT = host port; HERMES_DASHBOARD_PORT = in-container port.
      - "${HERMES_DASHBOARD_HOST_PORT:-${HERMES_DASHBOARD_PORT:-9119}}:${HERMES_DASHBOARD_PORT:-9119}"
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_PORT:-9119}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      API_SERVER_ENABLED: ${API_SERVER_ENABLED:-true}
      API_SERVER_HOST: ${API_SERVER_HOST:-0.0.0.0}
      API_SERVER_PORT: ${API_SERVER_PORT:-8642}
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      API_SERVER_CORS_ORIGINS: ${API_SERVER_CORS_ORIGINS:-*}
      HERMES_MODEL_PROVIDER: ${HERMES_MODEL_PROVIDER:-anthropic}
      HERMES_MODEL: ${HERMES_MODEL:-claude-opus-4-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OPENAI_COMPAT_* vars (if set) take priority over OPENAI_API_KEY /
      # OPENAI_BASE_URL — set HERMES_MODEL_PROVIDER=openai to use a generic
      # OpenAI-compatible endpoint with these shared vars.
      OPENAI_API_KEY: ${OPENAI_COMPAT_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-${OPENAI_BASE_URL:-}}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NOUS_API_KEY: ${NOUS_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    volumes:
      - "${HERMES_DATA_FOLDER:-./www/hermes}:/opt/data"
      - "${PROJECTS_FOLDER:-./www/projects}:/opt/projects"
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
    shm_size: ${HERMES_SHM_SIZE:-1g}
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-4G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${API_SERVER_PORT:-8642}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First container start with an empty /opt/data bind mount runs a
      # dependency-environment build (~15 min observed) before the API
      # server binds. start_period keeps compose reporting "starting"
      # (not "unhealthy") through that window; a successful probe still
      # flips the container healthy immediately, so warm starts are not
      # delayed by this.
      start_period: 900s

  # ── Option B: OpenClaw Gateway (optional sibling — enable with the `openclaw` profile)
  # OpenClaw running its OpenAI-compatible gateway, which the A2A gateway
  # bridges to over HTTP + SSE. Modeled on ../docker-openclaw/. The gateway
  # reaches it at http://openclaw:18789 when this profile is active (set
  # OPENCLAW_API_URL=http://openclaw:18789 in .env).
  openclaw:
    build:
      context: ./openclaw
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
        PYTHON: ${PYTHON:-python3.12}
        NODE_VERSION: ${NODE_VERSION:-26}
    container_name: ${OPENCLAW_CONTAINER_NAME:-container-openclaw}
    profiles: ["openclaw"]
    env_file:
      - .env
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - ./www:/var/www
      - ${PROJECTS_FOLDER:-./www/projects}:/var/www/projects
      # Named volume by default: OpenClaw's atomic config/state writes
      # fstat() a file after renaming it, which fails with ENOENT on Docker
      # Desktop (Windows/macOS) bind mounts — onboarding rolls back and the
      # gateway refuses to start. Set OPENCLAW_FOLDER to a host path (e.g.
      # ./www/openclaw) to bind-mount instead on a Linux host.
      - ${OPENCLAW_FOLDER:-openclaw-data}:/root/.openclaw
      # Same deploy key as the main gateway image (see "Private repos over
      # SSH" in README) — mounted read-only at runtime, never baked into
      # this image. Mounted at a staging path, not /root/.ssh directly: the
      # entrypoint copies it into a normal writable ~/.ssh and fixes
      # permissions before OpenClaw starts (a read-only mount can't be
      # chmod'd in place, and OpenSSH refuses group/world-readable key
      # files — a real risk with Windows-host bind mounts).
      - ${SSH_HOST_DIR:-./.ssh}:/root/.ssh-src:ro
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-https://ollama.com}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      # First-start model/provider auto-config (see .env.example):
      - OPENCLAW_MODEL_PROVIDER=${OPENCLAW_MODEL_PROVIDER:-}
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - OPENCLAW_CUSTOM_BASE_URL=${OPENCLAW_CUSTOM_BASE_URL:-}
      - OPENCLAW_CUSTOM_API_KEY=${OPENCLAW_CUSTOM_API_KEY:-}
      - OPENCLAW_CUSTOM_MODEL_ID=${OPENCLAW_CUSTOM_MODEL_ID:-}
      - OPENCLAW_CUSTOM_PROVIDER_ID=${OPENCLAW_CUSTOM_PROVIDER_ID:-}
      - OPENCLAW_CUSTOM_COMPATIBILITY=${OPENCLAW_CUSTOM_COMPATIBILITY:-openai}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      # Shared generic OpenAI-compatible endpoint (see .env.example):
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_MODEL=${OPENAI_COMPAT_MODEL:-}
    restart: unless-stopped

  # ── Option D: Goose Agent (optional sibling — enable with the `goose` profile)
  # goose (https://github.com/aaif-goose/goose) running `goose serve`, which
  # speaks ACP (Agent Client Protocol) over HTTP + SSE at /acp on port 3284.
  # The gateway's GooseAgentHandler (a2a_protocol_plugin) bridges A2A tasks to
  # it at http://goose:3284 while this profile is active (GOOSE_API_URL).
  goose:
    build:
      context: ./goose
      dockerfile: Dockerfile
      args:
        GOOSE_VERSION: ${GOOSE_VERSION:-1.53.0}
    container_name: ${GOOSE_CONTAINER_NAME:-container-goose}
    profiles: ["goose"]
    env_file:
      - .env
    ports:
      - "${GOOSE_PORT:-3284}:3284"
    volumes:
      # The goose agent's default working directory (GOOSE_CWD=/workspace).
      # goose tools run with the container's privileges; do not add broader
      # host mounts.
      - ${GOOSE_WORKSPACE_FOLDER:-./www/goose-workspace}:/workspace
      # Shared projects folder (same PROJECTS_FOLDER as hermes/openclaw): the
      # repos the agent works on, e.g. supplier_rating_agent_system with its
      # CLI and .agents/skills (goose loads .agents/skills from its working
      # directory). Keep only the repos the agent needs here, no supplier data.
      - ${PROJECTS_FOLDER:-./www/projects}:/workspace/projects
      # goose config + server state (config.yaml, server-secret.txt)
      - ${GOOSE_DATA_FOLDER:-goose-data}:/root/.config/goose
      # goose sessions database + logs
      - ${GOOSE_SHARE_FOLDER:-goose-share}:/root/.local/share/goose
    environment:
      # Server secret — REQUIRED; clients send it as X-Secret-Key. If empty,
      # the first start generates one, prints it and saves it in the
      # goose-data volume (server-secret.txt). Set GOOSE_SECRET_KEY (gateway
      # side) to the SAME value in .env.
      # First-start provider setup (openai_compat | anthropic | openrouter |
      # ollama | gemini); openai_compat uses the shared OPENAI_COMPAT_* vars.
      - GOOSE_MODEL_PROVIDER=${GOOSE_MODEL_PROVIDER:-}
      - GOOSE_MODEL=${GOOSE_MODEL:-}
      # goose's own tool-approval mode (auto | approve | smart_approve | chat).
      # The bridge's GOOSE_PERMISSION_MODE (auto_allow | deny | ask) decides
      # how permission requests are answered when goose asks.
      - GOOSE_MODE=${GOOSE_MODE:-auto}
      - OPENAI_API_KEY=${OPENAI_COMPAT_API_KEY:-${OPENAI_API_KEY:-}}
      - OPENAI_BASE_URL=${OPENAI_COMPAT_BASE_URL:-${OPENAI_BASE_URL:-}}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-https://ollama.com}
      # Headless container: no OS keyring, credentials come from env vars.
      - GOOSE_DISABLE_KEYRING=1
      - GOOSE_TELEMETRY_ENABLED=${GOOSE_TELEMETRY_ENABLED:-false}
      # Extra `goose serve` flags, e.g. `--with-builtin memory`
      # (the `developer` builtin is always loaded).
      - EXTRA_GOOSE_SERVE_ARGS=${EXTRA_GOOSE_SERVE_ARGS:-}
      # Project CLIs installed in a venv on the projects mount (e.g. `sra` in
      # /workspace/projects/.venvs/goose) come first on PATH.
      - PATH=${GOOSE_EXTRA_PATH:-/workspace/projects/.venvs/goose/bin}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    restart: unless-stopped
    healthcheck:
      # ACP `initialize` must return agentCapabilities; the script falls back
      # to the generated secret in goose-data and closes its connection
      # (goose/healthcheck.sh).
      test: ["CMD", "/usr/local/bin/goose-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Option E: pi Agent (optional sibling — enable with the `pi` profile)
  # pi (https://github.com/earendil-works/pi, pi.dev) is a minimal, self-
  # extensible terminal coding agent with NO network server. This sibling
  # bundles a small Node sidecar (./pi) that spawns `pi --mode rpc` child
  # processes over stdin/stdout JSONL (the official pi RPC protocol) and
  # exposes HTTP + SSE. The gateway's PiAgentHandler (a2a_protocol_plugin)
  # bridges A2A tasks to it at http://pi:3300 while this profile is active
  # (PI_API_URL). pi's built-in tools run WITHOUT approval prompts — the pi
  # process uses the container's own OS permissions, so this container is the
  # security boundary (workspace mount only; keep it scoped).
  pi:
    build:
      context: ./pi
      dockerfile: Dockerfile
      args:
        # Pinned pi CLI version (npm @earendil-works/pi-coding-agent). The RPC
        # behaviour is version-sensitive; re-run tests/pi/* on upgrades.
        PI_VERSION: ${PI_VERSION:-1.4.0}
    container_name: ${PI_CONTAINER_NAME:-container-pi}
    profiles: ["pi"]
    env_file:
      - .env
    ports:
      - "${PI_PORT:-3300}:3300"
    volumes:
      # The pi agent's default working directory (PI_CWD=/workspace). pi tools
      # run with the container's privileges; do not add broader host mounts.
      # Deliberately SEPARATE from www/projects — the gateway imports nothing
      # from the pi workspace.
      - ${PI_WORKSPACE_FOLDER:-./www/pi-workspace}:/workspace
      # Sidecar state: server-secret.txt, pi session files
      # (--session-dir /data/sessions) and sessions-index.json so sessions
      # survive sidecar restarts and can be re-opened transparently.
      - ${PI_DATA_FOLDER:-pi-data}:/data
      # pi user config (settings.json, models.json for custom endpoints).
      # First start writes models.json when PI_COMPAT_BASE_URL is set.
      - ${PI_AGENT_DIR_FOLDER:-pi-agent}:/root/.pi/agent
    environment:
      # Sidecar shared secret — REQUIRED; clients send it as X-Secret-Key. If
      # empty, first start generates one, prints it, and saves it in the
      # pi-data volume (server-secret.txt). Set PI_SECRET_KEY (gateway side)
      # to the SAME value in .env.
      - PI_SIDECAR_SECRET_KEY=${PI_SIDECAR_SECRET_KEY:-}
      # The container ALWAYS listens on 3300 — PI_PORT from .env is the
      # published HOST port (port-offset convention, cf. CONTAINER_PORT vs
      # GATEWAY_PORT for the gateway), so override the env_file passthrough
      # here to keep the host:container ports decoupled.
      - PI_PORT=3300
      # Default model/thinking for spawned sessions ("provider/modelId");
      # per-agent metadata (pi_model / pi_thinking) overrides these.
      # P1 SPIKE (2026-10-25): pi itself exports PI_PROVIDER / PI_MODEL to its
      # tool shells, so the sidecar's spawn defaults use the PI_SIDE_*
      # namespace and the sidecar STRIPS PI_MODEL/PI_PROVIDER/PI_THINKING/
      # PI_TOOLS from the pi child env — host-shell pi state can no longer
      # leak into the sidecar's spawn options.
      - PI_SIDE_MODEL=${PI_SIDE_MODEL:-}
      - PI_SIDE_PROVIDER=${PI_SIDE_PROVIDER:-}
      - PI_SIDE_MODEL_ID=${PI_SIDE_MODEL_ID:-}
      - PI_SIDE_THINKING=${PI_SIDE_THINKING:-}
      - PI_SIDE_TOOLS=${PI_SIDE_TOOLS:-}
      - PI_SIDE_EXTRA_ARGS=${PI_SIDE_EXTRA_ARGS:-}
      # Tool-approval extension (pi/extensions/tool-approval.js): comma list of
      # tools whose calls open a ctx.ui dialog ("*" = every tool; empty =
      # passive). The dialog is answered by the A2A bridge per the agent's
      # pi_permission_mode (auto_allow confirms / deny cancels / ask →
      # INPUT_REQUIRED until the user's approval_response). The optional
      # timeout fail-closes the dialog (agent-side auto-resolve = "no").
      - PI_SIDE_APPROVE_TOOLS=${PI_SIDE_APPROVE_TOOLS:-}
      - PI_SIDE_APPROVE_TIMEOUT_MS=${PI_SIDE_APPROVE_TIMEOUT_MS:-}
      # 1 keeps pi's project-trust gating (asks on the TUI only); 0 (default)
      # runs --no-approve, right for a headless container.
      - PI_SIDE_APPROVE=${PI_SIDE_APPROVE:-0}
      - PI_SIDE_OFFLINE=${PI_SIDE_OFFLINE:-0}
      - PI_SIDE_NO_EXTENSIONS=${PI_SIDE_NO_EXTENSIONS:-0}
      # First-start compatible-endpoint config: writes /root/.pi/agent/
      # models.json targeting PI_COMPAT_BASE_URL (default: the shared
      # OPENAI_COMPAT_* endpoint) with env-interpolated ${PI_COMPAT_API_KEY}.
      - PI_COMPAT_BASE_URL=${PI_COMPAT_BASE_URL:-${OPENAI_COMPAT_BASE_URL:-}}
      - PI_COMPAT_API_KEY=${PI_COMPAT_API_KEY:-${OPENAI_COMPAT_API_KEY:-}}
      - PI_COMPAT_MODEL=${PI_COMPAT_MODEL:-${OPENAI_COMPAT_MODEL:-}}
      # Provider credentials read directly by pi (see pi docs providers.md;
      # add more via .env and pass them here the same way).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_COMPAT_API_KEY:-${OPENAI_API_KEY:-}}
      - OPENAI_BASE_URL=${OPENAI_COMPAT_BASE_URL:-${OPENAI_BASE_URL:-}}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      # GET /health must return {"status":"ok",...} with the shared secret.
      test: ["CMD", "/usr/local/bin/pi-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


# A single default bridge network lets the gateway reach the `hermes` /
# `openclaw` / `goose` services by name (http://hermes:8642,
# http://openclaw:18789, http://goose:3284) when their respective profiles
# are active.

volumes:
  # OpenClaw config/agents/sessions (see the openclaw service's volumes).
  openclaw-data:
  # Goose agent config + server state, sessions db, and scoped workspace.
  goose-data:
  goose-share:
  # pi sibling: sidecar state (secret, session files, resume index) and the
  # pi user config dir (settings.json, models.json).
  pi-data:
  pi-agent:

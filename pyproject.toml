[project]
name            = "docker-a2a-gateway"
version         = "0.0.1"
description     = "Container image exposing the native A2A protocol surface via the SilvaEngine Gateway, bridging A2A tasks to a Hermes Agent API Server and/or an OpenClaw Gateway (both optional, profile-gated siblings)"
authors         = [{ name = "Idea Bosque", email = "ideabosque@gmail.com" }]
requires-python = ">=3.10"
# Runtime dependencies are pinned in requirements.txt (git-sourced modules).
dependencies    = []

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length    = 88
target-version = "py312"

[tool.black]
line-length    = 88
target-version = ["py312"]
